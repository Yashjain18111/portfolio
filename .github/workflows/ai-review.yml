name: AI PR Code Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI PR Debugger Engine
        run: |
          pip install git+https://github.com/Yashjain18111/ai-pr-debugger.git

      - name: Run Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-1.5-flash' }}
          MOCK_LLM: ${{ secrets.OPENAI_API_KEY == '' && secrets.LLM_API_KEY == '' }}
        run: |
          ai-pr-debugger review --git --branch origin/${{ github.base_ref }} --format markdown --output pr_review.md

      - name: Submit Review to PR
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr_review.md')) {
              const body = fs.readFileSync('pr_review.md', 'utf8');
              const requestChanges = body.includes('REQUEST CHANGES');
              const event = requestChanges ? 'REQUEST_CHANGES' : 'APPROVE';

              try {
                await github.rest.pulls.createReview({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.issue.number,
                  body: body,
                  event: event
                });
              } catch (err) {
                console.log('Falling back to comment:', err.message);
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
              }
            }