{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% if profile %}{{ profile.name }} | Python backend developer{% else %}Portfolio{% endif %}{% endblock %}</title>
    {% if profile %}<meta name="description" content="{{ profile.headline }}">{% endif %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
    {% block body %}{% endblock %}
    <script src="{% static 'core/js/main.js' %}" defer></script>
</body>
</html>
